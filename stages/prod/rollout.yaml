apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: kargo-demo
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: kargo-demo
  # The pod template is inline, not a workloadRef. Then an image change raises metadata.generation
  # in the same apply, so Argo CD reports Progressing until the Rollouts controller sees the change.
  template:
    metadata:
      labels:
        app: kargo-demo
    spec:
      containers:
      - name: nginx
        image: public.ecr.aws/nginx/nginx:placeholder
        volumeMounts:
        - name: content
          mountPath: /usr/share/nginx/html
          readOnly: true
      volumes:
      - name: content
        configMap:
          name: kargo-demo-content
  # Without a traffic router, canary weights come from pod counts.
  strategy:
    canary:
      steps:
        - setWeight: 50
        - pause: { duration: 30s }
