apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: kargo-demo
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: kargo-demo
  # A promotion changes only the Deployment, so metadata.generation of the Rollout stays the same.
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kargo-demo
  # Without a traffic router, canary weights come from pod counts.
  strategy:
    canary:
      steps:
        - pause: {}
        - setWeight: 50
        - pause: { duration: 30s }
