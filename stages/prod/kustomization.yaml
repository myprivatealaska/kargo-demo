apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ../../base
- configmap.yaml
- rollout.yaml

patches:
# The Rollout runs the pods, so the Deployment keeps none.
- target:
    kind: Deployment
    name: kargo-demo
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 0
- target:
    kind: Service
    name: kargo-demo
  patch: |-
    - op: replace
      path: /spec/ports/0/nodePort
      value: 32082
